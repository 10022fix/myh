<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/esqueci-senha.css?v=20261026-2">
    <title>Recuperar senha - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body class="recovery-page">
    <header class="recovery-header">
        <nav class="navbar" aria-label="Controles de aparência">
            <button class="theme-toggle" type="button" aria-label="Alternar tema"></button>
        </nav>
    </header>
    <main class="recovery-card">
        <a class="recovery-brand" href="/login.html" aria-label="Make Your Health - voltar ao login">
            <img src="/logo-myh-completa-removebg-preview.png" alt="Make Your Health">
        </a>
        <h1>Esqueci minha senha</h1>
        <p class="recovery-description">Informe o e-mail da sua conta. Enviaremos um link temporário para criar uma nova senha.</p>
        <form id="formRecuperacao">
            <div class="campo">
                <label for="email">E-mail:</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
            </div>
            <button type="submit" class="recovery-submit">Enviar link</button>
        </form>
        <p id="mensagem" class="recovery-message" aria-live="polite" role="status"></p>
        <a class="back-to-login" href="/login.html">Voltar ao login</a>
    </main>
    
    <script>
        document.getElementById("formRecuperacao").addEventListener("submit", async e => {
            e.preventDefault();
            const formulario = e.currentTarget;
            const botao = formulario.querySelector("button[type=submit]");
            const mensagem = document.getElementById("mensagem");
            botao.disabled = true;
            formulario.setAttribute("aria-busy", "true");
            mensagem.textContent = "Enviando...";
            try {
                const resposta = await fetch("/api/senha/esqueci", {
                    method: "POST",
                    body: new URLSearchParams(new FormData(formulario))
                });
                const dados = await resposta.json();
                mensagem.textContent = dados.mensagem || "Não foi possível solicitar o link.";
            } catch {
                mensagem.textContent = "Falha de conexão. Tente novamente.";
            } finally {
                botao.disabled = false;
                formulario.removeAttribute("aria-busy");
            }
        });
    </script>
</body>
</html>

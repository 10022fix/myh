<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
    <link rel="shortcut icon" href="/logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/tema.css">
    <link rel="stylesheet" href="/confirmar-email.css?v=20261026-4">
    <title>Confirmar e-mail - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body class="home-page recovery-page">
    <header class="home-header">
        <nav class="navbar home-nav" aria-label="Navegação principal">
            <a class="home-brand" href="/" aria-label="Make Your Health - início">
                <img src="/logo-myh-m-removebg-preview.png" alt="">
                <span>Make Your Health</span>
            </a>
            <a class="home-login" href="/login.html">Entrar</a>
            <a href="/cadastro.html" class="btn-aluno">Criar conta</a>
        </nav>
    </header>
    <main class="recovery-card">
        <a class="recovery-brand" href="/login.html" aria-label="Make Your Health - voltar ao login">
            <img src="/logo-myh-completa-removebg-preview.png" alt="Make Your Health">
        </a>
        <h1 id="tituloConfirmacao">Confirme seu e-mail</h1>
        <p id="descricaoConfirmacao" class="recovery-description">Estamos verificando o link de confirmação da sua conta.</p>
        <p id="mensagem" class="recovery-message" aria-live="polite" role="status">Estamos verificando seu link...</p>
    </main>
    <script>
        (async () => {
            const mensagem = document.getElementById("mensagem");
            const titulo = document.getElementById("tituloConfirmacao");
            const descricao = document.getElementById("descricaoConfirmacao");
            const aguardando = new URLSearchParams(location.search).get("aguardando") === "1";

            if (aguardando) {
                titulo.textContent = "Aguardando confirmação do e-mail";
                descricao.textContent = "Enviamos um link para o seu e-mail. Confirme por ele e volte a esta página para continuar seu cadastro.";
                mensagem.textContent = "Estamos aguardando a confirmação do seu endereço de e-mail.";
                let emailPendente = "";
                try { emailPendente = (localStorage.getItem("myhPendingSignupEmail") || "").trim().toLowerCase(); } catch (_) {}

                let confirmado = false;
                const concluirCadastro = () => {
                    if (confirmado) return;
                    confirmado = true;
                    try {
                        localStorage.removeItem("myhPendingSignupEmail");
                        localStorage.removeItem("myhSignupEmailConfirmed");
                    } catch (_) {}
                    titulo.textContent = "E-mail cadastrado com sucesso";
                    descricao.textContent = "Sua conta foi confirmada. Vamos abrir o questionário para você continuar o cadastro.";
                    mensagem.textContent = "Confirmação aprovada. Abrindo o questionário…";
                    clearInterval(intervalo);
                    setTimeout(() => { location.assign("/questionario.html"); }, 1400);
                };
                const verificarSessao = async () => {
                    if (confirmado || !emailPendente || document.visibilityState === "hidden") return;
                    try {
                        const emailConfirmado = (localStorage.getItem("myhSignupEmailConfirmed") || "").trim().toLowerCase();
                        if (emailConfirmado === emailPendente) {
                            titulo.textContent = "Confirmação aprovada";
                            descricao.textContent = "Sua confirmação foi recebida. Estamos preparando seu acesso ao questionário.";
                            mensagem.textContent = "Confirmação aprovada. Validando seu acesso…";
                        }
                    } catch (_) {}
                    try {
                        const resposta = await fetch("/api/sessao", { cache: "no-store", credentials: "same-origin" });
                        if (!resposta.ok) return;
                        const dadosSessao = await resposta.json();
                        if (!dadosSessao.sucesso || (dadosSessao.email || "").trim().toLowerCase() !== emailPendente) return;

                        concluirCadastro();
                    } catch (_) {
                        // A tela continua aguardando a sessão e tenta novamente quando voltar a ficar visível.
                    }
                };
                const intervalo = setInterval(verificarSessao, 2500);
                document.addEventListener("visibilitychange", verificarSessao);
                window.addEventListener("focus", verificarSessao);
                verificarSessao();
                return;
            }

            const token = new URLSearchParams(location.hash.slice(1)).get("token");
            if (!token) {
                titulo.textContent = "Confirme seu e-mail";
                descricao.textContent = "Abra o link de confirmação que enviamos para ativar sua conta.";
                mensagem.textContent = "Abra o link de confirmação que enviamos para seu e-mail. Se não encontrar, confira também o Spam.";
                return;
            }
            try {
                const resposta = await fetch("/api/cadastro/confirmar-email", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                    body: new URLSearchParams({ token }).toString()
                });
                const dados = await resposta.json().catch(() => ({}));
                mensagem.textContent = dados.sucesso
                    ? "Confirmação aprovada. Volte ao site e continue o cadastro."
                    : (dados.mensagem || "Não foi possível confirmar seu e-mail.");
                if (resposta.ok && dados.sucesso) {
                    if (dados.email) {
                        try {
                            const emailConfirmado = String(dados.email).trim().toLowerCase();
                            localStorage.setItem("myhPendingSignupEmail", emailConfirmado);
                            localStorage.setItem("myhSignupEmailConfirmed", emailConfirmado);
                        } catch (_) {}
                    }
                    history.replaceState(null, "", location.pathname);
                    titulo.textContent = "Confirmação aprovada";
                    descricao.textContent = "Seu endereço de e-mail foi confirmado.";
                } else if (!resposta.ok) {
                    titulo.textContent = "Não foi possível confirmar";
                    descricao.textContent = "O link pode ter expirado ou já ter sido utilizado. Volte ao site para solicitar outro.";
                }
            } catch {
                mensagem.textContent = "Falha de conexão. Abra o link novamente ou tente mais tarde.";
            }
        })();
    </script>
</body>
</html>

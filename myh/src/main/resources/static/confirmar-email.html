<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
    <link rel="shortcut icon" href="/logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/tema.css">
    <link rel="stylesheet" href="/confirmar-email.css?v=20261026-3">
    <title>Confirmar e-mail - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body class="home-page recovery-page">
    <header class="home-header">
        <nav class="navbar home-nav" aria-label="Navegação principal">
            <a class="home-brand" href="/" aria-label="Make Your Health - início">
                <img src="/logo-myh-m-removebg-preview.png" alt="">
                <span>Make Your Health</span>
            </a>
            <a class="home-login" href="/login.html">Entrar</a>
            <a href="/cadastro.html" class="btn-aluno">Criar conta</a>
        </nav>
    </header>
    <main class="recovery-card">
        <a class="recovery-brand" href="/login.html" aria-label="Make Your Health - voltar ao login">
            <img src="/logo-myh-completa-removebg-preview.png" alt="Make Your Health">
        </a>
        <h1>Confirme seu e-mail</h1>
        <p class="recovery-description">Estamos verificando o link de confirmação da sua conta.</p>
        <p id="mensagem" class="recovery-message" aria-live="polite" role="status">Estamos verificando seu link...</p>
        <a class="back-to-login" href="/login.html">Voltar ao login</a>
    </main>
    <script>
        (async () => {
            const mensagem = document.getElementById("mensagem");
            const token = new URLSearchParams(location.hash.slice(1)).get("token");
            if (!token) {
                mensagem.textContent = "Abra o link de confirmação que enviamos para seu e-mail. Se não encontrar, confira também o Spam.";
                return;
            }
            try {
                const resposta = await fetch("/api/cadastro/confirmar-email", {
                    method: "POST",
                    body: new URLSearchParams({ token })
                });
                const dados = await resposta.json();
                mensagem.textContent = dados.mensagem || "Não foi possível confirmar seu e-mail.";
                if (resposta.ok && dados.sucesso) {
                    history.replaceState(null, "", location.pathname);
                    setTimeout(() => location.href = dados.redirecionar || "/questionario.html", 1500);
                }
            } catch {
                mensagem.textContent = "Falha de conexão. Abra o link novamente ou tente mais tarde.";
            }
        })();
    </script>
</body>
</html>

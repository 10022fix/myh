<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/meu-treino.css?v=20261026-1">
    <title>Meu treino - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body class="dashboard-page">
    <header class="dashboard-header">
        <nav class="navbar dashboard-nav" aria-label="Navegação principal">
            <a class="dashboard-brand" href="/areadoaluno.html" aria-label="Make Your Health - início">
                <img src="logo-myh-m-removebg-preview.png" alt="MYH">
                <span>Make Your Health</span>
            </a>
            <div class="dashboard-links">
                <a href="/areadoaluno.html">Início</a>
                <a class="active" href="/meu-treino.html" aria-current="page">Treino</a>
                <a href="/meus-objetivos.html">Metas</a>
                <a href="/meu-progresso.html">Progresso</a>
            </div>
            <button type="button" class="theme-toggle" aria-label="Alternar tema"></button>
            <button id="sair" class="btn-sair" type="button">Sair</button>
        </nav>
    </header>
    <main class="dashboard dashboard--detail painel">
        <section class="detail-heading cabecalho">

            <div id="lista" class="lista"></div>
        </section>
    </main>
    <dialog id="exerciseGuideDialog" class="exercise-guide-dialog" aria-labelledby="exerciseGuideTitle"></dialog>
    <script src="/meu-treino.js?v=20261026-2"></script>
    <script>document.getElementById('sair').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; });</script>
</body>

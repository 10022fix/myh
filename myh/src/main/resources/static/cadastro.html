<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/stylecadastro.css">
    <link rel="stylesheet" href="/senha-toggle.css">
    <link rel="stylesheet" href="/tema.css">
    <title>Cadastro - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body>
    <header class="cabecalho">
        <nav class="navbar">
            <a class="logo" href="/" aria-label="Make Your Health - início">
                <img src="logo-myh-m-removebg-preview.png" alt="MYH">
            </a>

            <ul class="menu">
                <li><a href="/">INÍCIO</a></li>
                <li><a href="#">PLANOS</a></li>
                <li><a href="#">BLOG</a></li>
            </ul>

            <a href="/comeceagora.html" class="btn-aluno">
                ÁREA DO ALUNO
            </a>
        </nav>
    </header>

    <main class="cadastro">
        <img
            src="logo-myh-completa-removebg-preview.png"
            alt="Make Your Health"
            class="logo-cadastro"
        >

        <h1 class="titulo-cadastro">Faça parte da Make Your Health</h1>

        <form class="form-cadastro" id="formCadastro">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input id="email" name="email" type="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <div class="campo-senha">
                    <input
                        id="senha"
                        name="senha"
                        type="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                    <button class="alternar-senha" type="button" aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <path class="risco-olho" d="M3 3 21 21"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="area-botao">
                <button type="submit" class="btn-criar">Criar</button>
            </div>
        </form>

        <p id="mensagem" aria-live="polite"></p>
    </main>

    <script src="/senha-toggle.js" defer></script>
    <script>
        document
            .getElementById("formCadastro")
            .addEventListener("submit", async e => {
                e.preventDefault();

                const resposta = await fetch("/api/cadastro", {
                    method: "POST",
                    body: new URLSearchParams(new FormData(e.target))
                });

                const dados = await resposta.json();

                document.getElementById("mensagem").textContent =
                    dados.mensagem;

                if (dados.sucesso && dados.aguardandoConfirmacao) {
                    e.target.reset();
                } else if (dados.sucesso) {
                    setTimeout(() => {
                        location.href =
                            dados.redirecionar || "/questionario.html";
                    }, 700);
                }
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/stylecadastro.css">
    <link rel="stylesheet" href="/senha-toggle.css">
    <link rel="stylesheet" href="/tema.css">
    <link rel="stylesheet" href="/styleauth-refresh.css?v=20261025-2">
    <title>Cadastro - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body class="auth-page">
    
    <header class="cabecalho">
        <nav class="navbar">
            <a class="logo" href="/" aria-label="Make Your Health - início">
                <img src="logo-myh-completa-removebg-preview.png" alt="Make Your Health">
            </a>
            <a class="auth-nav-link" href="/login.html">Entrar</a>
            <a class="btn-aluno" href="/cadastro.html" aria-current="page">Criar conta</a>
        </nav>
    </header>

    <main class="cadastro auth-card">
        <h1 class="titulo-cadastro">Crie sua conta</h1>
        <p class="auth-subtitle">Seu plano começa aqui.</p>
        <nav class="auth-tabs" aria-label="Acesso à conta">
            <a href="/login.html">Entrar</a>
            <a class="active" href="/cadastro.html" aria-current="page">Criar conta</a>
        </nav>

        <form class="form-cadastro" id="formCadastro">
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" autocomplete="name" placeholder="Como devemos te chamar?" required>
            </div>

            <div class="campo">
                <label for="apelidoAcesso">Apelido de acesso</label>
                <input id="apelidoAcesso" name="apelidoAcesso" type="text" minlength="3" maxlength="30"
                    pattern="[A-Za-z0-9._-]{3,30}" autocomplete="username"
                    title="Use de 3 a 30 letras, números, ponto, hífen ou sublinhado."
                    placeholder="Ex.: usario_123" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" pattern="[^@]+@[Gg][Mm][Aa][Ii][Ll][.]com"
                    title="Use somente um endereço terminado em @gmail.com."
                    autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="campo-senha">
                    <input
                        id="senha"
                        name="senha"
                        type="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                    <button class="alternar-senha" type="button" aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
                        <span>Mostrar</span>
                    </button>
                </div>
            </div>

            <div class="area-botao">
                <button type="submit" class="btn-criar">Criar conta e começar</button>
            </div>
        </form>

        <p id="mensagem" aria-live="polite"></p>
    </main>

    <script src="/senha-toggle.js" defer></script>
    <script>
        document
            .getElementById("formCadastro")
            .addEventListener("submit", async e => {
                e.preventDefault();
                const formulario = e.target;
                const botao = formulario.querySelector('[type="submit"]');
                const mensagem = document.getElementById("mensagem");

                botao.disabled = true;
                formulario.setAttribute("aria-busy", "true");
                mensagem.classList.add("mensagem-processando");
                mensagem.textContent = "Salvando respostas ao banco...";

                try {
                    const resposta = await fetch("/api/cadastro", {
                        method: "POST",
                        body: new URLSearchParams(new FormData(formulario))
                    });
                    const dados = await resposta.json();

                    mensagem.classList.remove("mensagem-processando");
                    mensagem.textContent = dados.mensagem;

                    if (dados.sucesso && dados.aguardandoConfirmacao) {
                        formulario.reset();
                    } else if (dados.sucesso) {
                        setTimeout(() => {
                            location.href = dados.redirecionar || "/questionario.html";
                        }, 700);
                    }
                } catch (_) {
                    mensagem.classList.remove("mensagem-processando");
                    mensagem.textContent = "Não foi possível concluir o cadastro. Tente novamente.";
                } finally {
                    botao.disabled = false;
                    formulario.removeAttribute("aria-busy");
                }
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">

    <link rel="shortcut icon" href="logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/tema.css">
    <link rel="stylesheet" href="/stylequestionario.css?v=20261026-3">

    <title>Questionário - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body class="questionario-page">

    <header class="quiz-header">
        <nav class="navbar home-nav" aria-label="Navegação principal">
            <a class="home-brand" href="/" aria-label="Make Your Health - início">
                <img src="/logo-myh-m-removebg-preview.png" alt="">
                <span>Make Your Health</span>
            </a>
            <a class="home-login" href="/login.html">Entrar</a>
            <a href="/cadastro.html" class="btn-aluno">Criar conta</a>
        </nav>

    </header>

    <div class="quiz-progresso">
        <div class="quiz-progresso-meta">
            <button id="btnVoltar" class="btn-voltar" aria-label="Voltar">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </button>
            <span id="progressoTexto" aria-live="polite">Preparando questionário</span>
        </div>
        <div class="progresso" role="progressbar" aria-label="Progresso do questionário">
            <div id="progressoBarra" class="progresso-barra"></div>
        </div>
    </div>

    <main class="quiz">
        <div id="perguntaContainer" class="pergunta-container">
            <!-- Perguntas são renderizadas aqui via JS -->
        </div>

    </main>

    <script src="/questionario.js?v=20261026-2"></script>
</body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="shortcut icon" href="/logo-myh-m.png"><link rel="stylesheet" href="/area-aluno.css">
    <link rel="stylesheet" href="/tema.css"><title>Meu progresso - Make Your Health</title>    <script src="/tema.js"></script>
</head><body>
<nav class="navbar"><a class="logo" href="/areadoaluno.html"><img src="/logo-myh-m.png" alt="MYH"></a><span class="marca">MAKE YOUR HEALTH</span><a class="nav-voltar" href="/areadoaluno.html">← Área do aluno</a></nav>
<main class="painel"><section class="cabecalho"><p class="sobretitulo">MEU PROGRESSO</p><h1>Celebre cada avanço.</h1><p>Registre peso e medidas para enxergar sua evolução com mais clareza.</p></section><section class="conteudo"><div id="vazio" class="vazio oculto"><h2>Nenhum progresso registrado.</h2><p>Faça seu primeiro registro e comece a acompanhar sua evolução.</p><button id="abrirCadastro">Registrar progresso</button></div><div id="resumo" class="progresso-resumo oculto"></div><div id="registros" class="lista"></div><button id="novo" class="oculto">+ Registrar progresso</button><form id="formulario" class="formulario oculto"><h2>Registrar progresso</h2><div class="campos"><div class="campo"><label>Peso atual (kg) <input name="peso" type="number" min="1" step="0.1" required></label></div><div class="campo"><label>% de gordura <input name="gordura" type="number" min="0" max="100" step="0.1"></label></div><div class="campo"><label>Data <input id="dataRegistro" name="dataRegistro" type="date" required></label></div><div class="campo"><label>Braço (cm) <input name="braco" type="number" min="0" step="0.1"></label></div><div class="campo"><label>Cintura (cm) <input name="cintura" type="number" min="0" step="0.1"></label></div><div class="campo"><label>Peito (cm) <input name="peito" type="number" min="0" step="0.1"></label></div></div><button type="submit">Salvar registro</button><p id="mensagem" class="mensagem"></p></form></section></main><script src="/meu-progresso.js"></script></body></html>

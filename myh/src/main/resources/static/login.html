<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/stylelogin.css">
    <link rel="stylesheet" href="/senha-toggle.css">
    <link rel="stylesheet" href="/tema.css">
    <link rel="stylesheet" href="/styleauth-refresh.css?v=20261025-2">
    <title>Login - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body class="auth-page login-page">
    <header class="cabecalho">
        <nav class="navbar">
            <a class="logo" href="/" aria-label="Make Your Health - início">
                <img src="logo-myh-completa-removebg-preview.png" alt="Make Your Health">
            </a>
            <a class="auth-nav-link auth-nav-active" href="/login.html">Entrar</a>
            <a class="btn-aluno" href="/cadastro.html">Criar conta</a>
        </nav>
    </header>

    <main class="cadastro auth-card">
        <h1 class="titulo-cadastro">Bem-vindo de volta</h1>
        <p class="auth-subtitle">Entre para ver seu treino de hoje.</p>
        <nav class="auth-tabs" aria-label="Acesso à conta">
            <a class="active" href="/login.html" aria-current="page">Entrar</a>
            <a href="/cadastro.html">Criar conta</a>
        </nav>

        <form class="form-cadastro" id="formLogin">
            <div class="campo">
                <label for="login">E-mail ou apelido</label>
                <input id="login" name="login" type="text" autocomplete="username" placeholder="seu e-mail ou apelido" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="campo-senha">
                    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
                    <button class="alternar-senha" type="button" aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
                        <span>Mostrar</span>
                    </button>
                </div>
            </div>

            <div class="area-botao">
                <button type="submit" class="btn-criar">Entrar</button>
            </div>
        </form>

        <p class="link-recuperacao"><a href="/esqueci-senha.html">Esqueci minha senha</a></p>
        <p class="demo-login-link"><a href="/demonstracao.html">Pular e ver a conta de demonstração →</a></p>
        <p id="mensagem" aria-live="polite"></p>
    </main>

    <script src="/senha-toggle.js" defer></script>
    <script>
        document
            .getElementById("formLogin")
            .addEventListener("submit", async e => {
                e.preventDefault();
                const formulario = e.target;
                const botao = formulario.querySelector('[type="submit"]');
                const mensagem = document.getElementById("mensagem");

                botao.disabled = true;
                formulario.setAttribute("aria-busy", "true");
                mensagem.classList.add("mensagem-processando");
                mensagem.textContent = "Salvando respostas ao banco...";

                try {
                    const resposta = await fetch("/api/login", {
                        method: "POST",
                        body: new URLSearchParams(new FormData(formulario))
                    });
                    const dados = await resposta.json();

                    mensagem.classList.remove("mensagem-processando");
                    mensagem.textContent = dados.mensagem;

                    if (dados.sucesso) {
                        setTimeout(() => {
                            location.href = "/areadoaluno.html";
                        }, 600);
                    }
                } catch (_) {
                    mensagem.classList.remove("mensagem-processando");
                    mensagem.textContent = "Não foi possível entrar. Verifique sua conexão e tente novamente.";
                } finally {
                    botao.disabled = false;
                    formulario.removeAttribute("aria-busy");
                }
            });
    </script>
</body>
</html>

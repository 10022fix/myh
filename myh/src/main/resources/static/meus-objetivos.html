<main class="painel"><section class="cabecalho"><p class="sobretitulo">MEUS OBJETIVOS</p><h1>Metas claras, evolução real.</h1><p>Defina onde você quer chegar e mantenha seu foco em cada etapa.</p></section><section class="conteudo"><div id="vazio" class="vazio oculto"><h2>Você ainda não possui objetivos.</h2><p>Crie sua primeira meta para acompanhar sua jornada.</p><button id="abrirCadastro">Cadastrar objetivo</button></div><div id="objetivos" class="objetivos"></div><button id="novo" class="oculto">+ Novo objetivo</button><form id="formulario" class="formulario oculto"><h2>Cadastrar objetivo</h2><p>Preencha o que fizer sentido para sua meta.</p><div class="campos"><div class="campo"><label for="objetivo">Objetivo</label><select id="objetivo" name="objetivo" required><option value="">Selecione</option><option>Emagrecer</option><option>Ganhar Massa</option><option>Condicionamento</option><option>Definicao</option><option>Saude</option></select></div><div class="campo"><label for="pesoMeta">Peso-meta (kg)</label><input id="pesoMeta" name="pesoMeta" type="number" min="1" step="0.1"></div><div class="campo"><label for="dataMeta">Data desejada</label><input id="dataMeta" name="dataMeta" type="date"></div></div><button type="submit">Salvar objetivo</button><p id="mensagem" class="mensagem"></p></form></section></main><script src="/meus-objetivos.js"></script></body></html>

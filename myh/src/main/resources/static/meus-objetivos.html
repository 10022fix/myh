<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/logo-myh-m-removebg-preview.png">
    <link rel="stylesheet" href="/meus-objetivos.css?v=20261027-6">
    <title>Minhas metas - Make Your Health</title>
    <script src="/tema.js"></script>
</head>
<body class="dashboard-page">
    <header class="dashboard-header">
        <nav class="navbar dashboard-nav" aria-label="Navegação principal">
            <a class="dashboard-brand" href="/areadoaluno.html" aria-label="Make Your Health - início">
                <img src="logo-myh-m-removebg-preview.png" alt="MYH">
                <span>Make Your Health</span>
            </a>
            <div class="dashboard-links">
                <a href="/areadoaluno.html">Início</a>
                <a href="/meu-treino.html">Treino</a>
                <a class="active" href="/meus-objetivos.html" aria-current="page">Metas</a>
                <a href="/meu-progresso.html">Progresso</a>
            </div>
            <button type="button" class="theme-toggle" aria-label="Alternar tema"></button>
            <button id="sair" class="btn-sair" type="button">Sair</button>
        </nav>
    </header>
    <main class="dashboard dashboard--detail painel">
        <section class="detail-heading cabecalho">
            <h1>Minhas metas</h1>
            <p>Metas claras ajudam a manter o foco.</p>
        </section>
        <section class="detail-content conteudo" aria-label="Objetivos pessoais">
            <div id="vazio" class="vazio oculto"><h2>Você ainda não possui objetivos.</h2><p>Crie sua primeira meta para acompanhar sua jornada.</p><button id="abrirCadastro">Cadastrar objetivo</button></div>
            <div id="objetivos" class="objetivos"></div>
            <button id="novo" class="oculto">+ Nova meta</button>
            <form id="formulario" class="formulario oculto">
                <h2 id="tituloFormulario">Nova meta</h2>
                <div class="campos">
                    <div class="campo"><label for="objetivo">Objetivo</label><select id="objetivo" name="objetivo" required><option value="">Selecione</option><option>Emagrecer</option><option>Ganhar Massa</option><option>Condicionamento</option><option>Definicao</option><option>Saude</option></select></div>
                    <div class="campo"><label for="pesoMeta">Peso-meta (kg)</label><input id="pesoMeta" name="pesoMeta" type="number" min="1" step="0.1"></div>
                    <div class="campo campo-largo"><label for="dataMeta">Data desejada (opcional)</label><input id="dataMeta" name="dataMeta" type="date"></div>
                </div>
                <div class="acoes-formulario"><button type="submit">Salvar meta</button><button id="cancelarEdicao" class="botao-secundario" type="button">Cancelar</button></div>
                <p id="mensagem" class="mensagem" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="/meus-objetivos.js"></script>
    <script>document.getElementById('sair').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; });</script>
</body>
</html>
